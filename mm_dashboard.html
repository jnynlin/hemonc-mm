function parseCSV(text){ if(text.charCodeAt(0)===0xFEFF) text=text.slice(1); const rows=[]; let row=[],cell='',q=false; for(let i=0;i<text.length;i++){ const ch=text[i]; if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; } else { if(ch==='"') q=true; else if(ch===','){row.push(cell);cell='';} else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[];cell=''; } else cell+=ch; } } if(cell!==''||row.length){row.push(cell);rows.push(row);} return rows.filter(r=>r.some(c=>c.trim()!=='')); }
function rowsToObjects(rows){ const h=rows[0].map(x=>x.trim()); return rows.slice(1).map(r=>{const o={};h.forEach((k,i)=>o[k]=(r[i]??'').toString().trim());return o;}); }
async function readFile(file){ const name=file.name.toLowerCase(); if(name.endsWith('.csv')||name.endsWith('.txt')) return rowsToObjects(parseCSV(await file.text()));
  if(!window.XLSX) throw new Error('沒有網路載入 Excel 解析器，請改用「匯出至 CSV」'); const wb=XLSX.read(await file.arrayBuffer(),{type:'array'}); const ws=wb.Sheets[wb.SheetNames[0]]; return rowsToObjects(XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}).map(r=>r.map(x=>String(x??'')))); }
const col=(o,...names)=>{ for(const n of names){ for(const k of Object.keys(o)){ if(k.replace(/\s/g,'')===n) return String(o[k]??''); } } return ''; };
const multi=s=>String(s||'').split(/;#|;|；|\n/).map(x=>x.trim()).filter(x=>x&&!/^\d+$/.test(x));
const num=s=>{const n=parseFloat(String(s).replace(/[^\d.-]/g,''));return isNaN(n)?null:n;};
const ymOf=(s)=>{ const m=String(s).match(/(\d{4})[-/.](\d{1,2})/); return m?`${m[1]}-${m[2].padStart(2,'0')}`:''; };
function mapCase(o){ return { code:col(o,'標題','案例代碼','Title'), ym:ymOf(col(o,'年月')), types:multi(col(o,'案例類型')), ageBand:col(o,'年齡層'), age:col(o,'年齡'), nameShort:col(o,'病人簡稱'), sex:col(o,'性別'), dxGroup:col(o,'診斷群'), phase:col(o,'治療階段'),

  initial:{mainFactor:col(o,'初評主要根因'),factors:multi(col(o,'初評促成因素')),preventability:col(o,'初評可預防性')},
  attending:{status:col(o,'主治醫師回覆')||'未徵詢',mainFactor:col(o,'主治認為主要根因'),preventability:col(o,'主治認為可預防性'),comment:col(o,'主治醫師說明')},
  whys:col(o,'五個為什麼','5Whys'), teachingPoints:col(o,'學習重點'), refs:col(o,'參考指引文獻','參考'), status:col(o,'狀態'), report:/^(是|yes|true|1)$/i.test(col(o,'會中報告')) }; }
function mapRecord(o){ const r=mapCase(o); r.consensus={mainFactor:col(o,'共識主要根因'),factors:multi(col(o,'共識促成因素')),preventability:col(o,'共識可預防性'),notes:col(o,'會議結論'),voteCount:num(col(o,'票數'))||0,dist:col(o,'投票分布')};
  r.decisionMode=col(o,'決策方式'); r.chiefComment=col(o,'長官意見'); r.meetingDate=col(o,'會議日期'); r.attendees=num(col(o,'出席人數'))||0; r.amendments=col(o,'修正附註');
  const ag=col(o,'初評一致'); r.agreeMain = ag?/是|yes|true/i.test(ag):(r.initial.mainFactor===r.consensus.mainFactor); if(!r.ym) r.ym=ymOf(r.meetingDate); return r; }
function mapFactor(o){ return {name:col(o,'標題','因素名稱','Title'),group:col(o,'層級','群組'),order:num(col(o,'排序'))||0}; }
function mapAction(o){ return {id:o._id,doneDate:col(o,'完成日期'),effect:col(o,'成效確認'),effectNote:col(o,'成效說明'),evidence:col(o,'佐證連結'),title:col(o,'標題','行動','Title'),owner:col(o,'負責人'),due:col(o,'到期日'),status:col(o,'狀態'),factor:col(o,'針對因素'),cases:multi(col(o,'關聯紀錄','關聯案例')),note:col(o,'備註')}; }

  state.loaded[kind]={name:file.name,n:objs.length,at:new Date().toLocaleString()}; if(kind==='records'){ const l=[...state.records].sort((a,b)=>b.ym.localeCompare(a.ym))[0]; state.recYm=l?l.ym:nowYm(); } persist(); }

const tip=$('#tip'); function bindTips(root){ root.querySelectorAll('[data-tip]').forEach(el=>{ el.addEventListener('pointerenter',e=>{tip.textContent=el.dataset.tip;tip.hidden=false;moveTip(e);}); el.addEventListener('pointermove',moveTip); el.addEventListener('pointerleave',()=>tip.hidden=true); }); } function moveTip(e){ tip.style.left=Math.min(e.clientX+12,window.innerWidth-270)+'px'; tip.style.top=(e.clientY+14)+'px'; }
const recIn=ym=>state.records.filter(r=>r.ym===ym); const cMain=r=>r.consensus.mainFactor; const cFactors=r=>[...new Set([cMain(r),...r.consensus.factors].filter(Boolean))]; const cPrev=r=>r.consensus.preventability;
function factorCounts(recs,mode){ const m=new Map(); recs.forEach(r=>(mode==='main'?(cMain(r)?[cMain(r)]:[]):cFactors(r)).forEach(n=>m.set(n,(m.get(n)||0)+1))); return [...m.entries()].map(([name,n])=>({name,n,group:facGroup(name)})).sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name,'zh-Hant')); }
function recurring(endYm){ const yms=rangeYms(endYm,6); const m=new Map(); state.records.filter(r=>yms.includes(r.ym)).forEach(r=>cFactors(r).forEach(n=>{ if(!m.has(n)) m.set(n,new Set()); m.get(n).add(r.ym); })); return [...m.entries()].filter(([,s])=>s.size>=3).map(([name,s])=>({name,months:[...s].sort()})).sort((a,b)=>b.months.length-a.months.length); }
function stackedMonthly(yms){ const W=640,H=230,L=36,R=12,T=14,B=34,iw=W-L-R,ih=H-T-B; const data=yms.map(ym=>({ym,v:TYPES.map(t=>recIn(ym).filter(c=>hasType(c,t)).length)})); const max=Math.max(1,...data.map(d=>d.v.reduce((a,b)=>a+b,0))); const step=max<=5?1:max<=10?2:max<=20?5:10; const top=Math.ceil(max/step)*step; const y=v=>T+ih-(v/top)*ih; const bw=Math.min(36,iw/yms.length*0.6); const xs=i=>L+iw*(i+0.5)/yms.length;
  let g='<g class="grid">'; for(let v=0;v<=top;v+=step) g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`; g+='</g>'; let bars='';
  data.forEach((d,i)=>{ let acc=0; const tot=d.v.reduce((a,b)=>a+b,0); d.v.forEach((n,k)=>{ if(!n) return; const y1=y(acc+n),h=y(acc)-y1-(acc?2:0); bars+=`<rect x="${xs(i)-bw/2}" y="${y1}" width="${bw}" height="${Math.max(0,h)}" rx="${acc+n===tot?4:0}" fill="var(${TYPE_VAR[TYPES[k]]})" data-tip="${esc(ymLabel(d.ym))} ${TYPES[k]}：${n} 件"/>`; acc+=n; }); if(tot) bars+=`<text class="lbl" x="${xs(i)}" y="${y(tot)-5}" text-anchor="middle">${tot}</text>`; bars+=`<text x="${xs(i)}" y="${H-B+16}" text-anchor="middle" ${d.ym===state.recYm?'font-weight="700" fill="var(--fg)"':''}>${d.ym.slice(2).replace('-','/')}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="每月定案案例數">${g}<line class="axis" x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}"/>${bars}</svg>`; }
function paretoChart(rows,all){ if(!rows.length) return '<div class="empty">此範圍內尚無紀錄。</div>'; rows=rows.slice(0,10); const total=rows.reduce((a,r)=>a+r.n,0); const W=640,rowH=28,L=200,R=70,T=6,H=T+rows.length*rowH+8,iw=W-L-R,max=rows[0].n; let acc=0,s=''; rows.forEach((r,i)=>{ acc+=r.n; const w=Math.max(2,iw*r.n/max),y=T+i*rowH; s+=`<text x="${L-8}" y="${y+18}" text-anchor="end">${esc(r.name.length>13?r.name.slice(0,12)+'…':r.name)}</text><rect x="${L}" y="${y+6}" width="${w}" height="16" rx="4" fill="var(--s1)" data-tip="${esc(r.name)}（${esc(r.group)}）：${r.n} 件，累積 ${Math.round(acc/total*100)}%"/>${w>iw-30?`<text class="lbl" x="${L+w-6}" y="${y+18}" text-anchor="end" fill="#fff" style="fill:#fff">${r.n}</text>`:`<text class="lbl" x="${L+w+6}" y="${y+18}">${r.n}</text>`}<text x="${W-R+10}" y="${y+18}" fill="var(--muted)">${Math.round(acc/total*100)}%</text>`; }); return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${all?'共識根因柏拉圖（所有因素）':'共識主要根因柏拉圖'}">${s}</svg>`; }
function prevChart(recs){ const counts=PREV.map(p=>recs.filter(r=>cPrev(r)===p).length); const total=counts.reduce((a,b)=>a+b,0); if(!total) return '<div class="empty">尚無資料。</div>'; const W=640,H=64; let x=0,s='',lbl=''; const cols=['var(--seq1)','var(--seq2)','var(--seq3)','var(--seq4)']; counts.forEach((n,i)=>{ if(!n) return; const w=W*n/total; s+=`<rect x="${x}" y="8" width="${Math.max(0,w-2)}" height="22" rx="3" fill="${cols[i]}" data-tip="${PREV[i]}：${n} 件（${Math.round(n/total*100)}%）"/>`; if(w>70) lbl+=`<text x="${x+w/2}" y="48" text-anchor="middle">${PREV[i]} ${n}</text>`; x+=w; }); return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="可預防性分布">${s}${lbl}</svg>`; }
function losChart(recs){ const thr=state.thr||30; const bins=[[thr,thr+14],[thr+15,thr+29],[thr+30,thr+59],[thr+60,Infinity]]; const labels=bins.map(([a,b])=>b===Infinity?`≥${a} 天`:`${a}–${b} 天`); const counts=bins.map(([a,b])=>recs.filter(c=>c.los>=a&&c.los<=b).length); if(!counts.some(Boolean)) return '<div class="empty">此範圍內無超長住院紀錄。</div>'; const W=640,H=170,L=30,T=12,B=30,ih=H-T-B,iw=W-L-10,max=Math.max(...counts); const y=v=>T+ih-(v/max)*ih; const bw=Math.min(70,iw/4*0.6); let s=''; counts.forEach((n,i)=>{ const cx=L+iw*(i+0.5)/4; s+=`<rect x="${cx-bw/2}" y="${y(n)}" width="${bw}" height="${y(0)-y(n)}" rx="4" fill="var(--s1)" data-tip="${labels[i]}：${n} 件"/><text class="lbl" x="${cx}" y="${y(n)-5}" text-anchor="middle">${n||''}</text><text x="${cx}" y="${H-B+16}" text-anchor="middle">${labels[i]}</text>`; }); return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="超長住院天數分布"><line class="axis" x1="${L}" x2="${W-10}" y1="${y(0)}" y2="${y(0)}"/>${s}</svg>`; }
function crossTab(recs){ const groups=[...new Set([...groupsOf(),...recs.map(r=>facGroup(cMain(r)))])]; const rows=groups.map(g=>({g,v:TYPES.map(t=>recs.filter(r=>hasType(r,t)&&facGroup(cMain(r))===g).length)})).filter(r=>r.v.some(Boolean)); if(!rows.length) return '<div class="empty">尚無資料。</div>'; const max=Math.max(...rows.flatMap(r=>r.v)); const colr=n=>n===0?'transparent':n<=max*0.25?'var(--seq1)':n<=max*0.5?'var(--seq2)':n<=max*0.75?'var(--seq3)':'var(--seq4)'; const ink=n=>n>max*0.5?'#fff':'var(--fg)'; return `<div class="tbl"><table class="xtab"><thead><tr><th>共識主要根因層級</th>${TYPES.map(t=>`<th class="num">${t}</th>`).join('')}<th class="num">合計</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.g)}</td>${r.v.map(n=>`<td class="cell" style="background:${colr(n)};color:${ink(n)}">${n||''}</td>`).join('')}<td class="num">${r.v.reduce((a,b)=>a+b,0)}</td></tr>`).join('')}</tbody></table></div>`; }

function openVote(c,f){ let timer=null, startId=null, closed=false; const ov=document.createElement('div'); ov.className='vote-ov'; document.body.appendChild(ov);
  const close=()=>{ closed=true; clearInterval(timer); ov.remove(); };
  const bar=(dist,n)=>PREV.map(p=>{ const k=dist[p]||0, w=n?Math.round(k/n*100):0; return `<div class="vrow"><span class="vl">${p}</span><span class="vb"><span style="width:${w}%"></span></span><span class="vk">${k}</span></div>`; }).join('');
  ov.innerHTML='<div class="vbox"><p class="vn">準備投票…</p></div>';
  SP.vote.start().then(v=>{ if(closed) return; startId=v.startId;
    ov.innerHTML=`<div class="vbox"><h2>匿名投票：${esc(c.code)} 的可預防性</h2><div class="vqr">${v.svg}</div><p class="vurl">手機相機掃描 QR code，選一個選項後按「儲存」。</p><p class="vn">已收到 <b id="vn">0</b> 票</p><p class="small muted">畫面只顯示票數，不顯示誰投了什麼；同一人重投以最後一次為準。</p><div class="vbtn"><button class="btn primary" id="vend">結束投票</button><button class="btn" id="vx">取消</button></div></div>`;
    $('#vx',ov).addEventListener('click',close);
    const poll=async()=>{ try{ const t=await SP.vote.tally(startId); if(!closed&&$('#vn',ov)) $('#vn',ov).textContent=t.n; }catch(e){} };
    timer=setInterval(poll,3000); poll();
    $('#vend',ov).addEventListener('click',async()=>{ clearInterval(timer); $('#vend',ov).disabled=true; $('#vend',ov).textContent='統計中…';
      try{ const t=await SP.vote.stop(startId,c.code); const top=Math.max(0,...PREV.map(p=>t.dist[p]||0)), win=PREV.filter(p=>(t.dist[p]||0)===top&&top>0);
        ov.innerHTML=`<div class="vbox"><h2>投票結果：${esc(c.code)}</h2><p class="vn">共 ${t.n} 票</p><div class="vbars">${bar(t.dist,t.n)}</div><p style="font-size:1.25rem">${win.length===1?`最多票：<b>${win[0]}</b>`:t.n?'最高票同票，請主任裁定可預防性。':'沒有收到投票。'}</p><div class="vbtn"><button class="btn primary" id="vapply">套用到定案表單</button><button class="btn" id="vx2">關閉</button></div></div>`;
        $('#vx2',ov).addEventListener('click',close);
        $('#vapply',ov).addEventListener('click',()=>{ f.votes.value=t.n; f.dist.value=PREV.filter(p=>t.dist[p]).map(p=>`${p} ${t.dist[p]}`).join('、'); if(win.length===1) f.prev.value=win[0]; const r=[...f.querySelectorAll('input[name=mode]')].find(x=>x.value===(win.length===1?'投票':'主席裁定')); if(r) r.checked=true; close(); f.prev.dispatchEvent(new Event('change')); $('#dmsg').textContent=win.length===1?'已套用投票結果，確認後按「定案」。':'同票：已填入票數，請主任選定可預防性後按「定案」。'; });
      }catch(e){ ov.innerHTML=`<div class="vbox"><p class="vn">統計失敗：${esc(e.message)}</p><div class="vbtn"><button class="btn" id="vx3">關閉</button></div></div>`; $('#vx3',ov).addEventListener('click',close); } });
  }).catch(e=>{ ov.innerHTML=`<div class="vbox"><p class="vn">無法開始投票：${esc(e.message)}</p><div class="vbtn"><button class="btn" id="vx4">關閉</button></div></div>`; $('#vx4',ov).addEventListener('click',close); }); }
function openDrawer(on){ const d=$('#drawer'); document.body.classList.toggle('drawer-open',!!(d&&on)); if(!d) return; d.hidden=!on; $('#dopen').hidden=on; if(on){ const x=d.querySelector('select,input,button:not(#dclose)'); if(x) x.focus(); } }
function renderPresent(){ document.body.classList.remove('drawer-open'); const el=$('#v-present'); let q=queue();
  if(!q.length&&state.onlyRep){ const rest=state.drafts.filter(inPool).length; if(rest){ state.onlyRep=false; state.presIdx=0; state.flash=(state.flash?state.flash+' ':'')+`會中報告的案例已全部定案，接著是其餘 ${rest} 例。`; q=queue(); } }
  const ctl=(i,n)=>`<div class="ctl"><button class="btn sm" id="pv" ${i<=0?'disabled':''}>◀ 上一案</button><span class="pos">${n?`${i+1}／${n}`:''}</span><button class="btn sm" id="nx" ${i>=n-1?'disabled':''}>下一案 ▶</button><button class="btn sm" id="ex">離開</button><span class="hint">鍵盤 ← →　Esc 離開</span></div>`;
  if(!q.length){ const fl=state.flash; state.flash=null; el.innerHTML=`<div class="pres">${fl?`<div class="flash">${esc(fl)}</div>`:''}<div class="wait">${SP&&state.records.length?'待討論案例已全部定案':'目前沒有待討論案例'}</div>${ctl(0,0)}</div>`; } else { state.presIdx=Math.max(0,Math.min(q.length-1,state.presIdx)); const c=q[state.presIdx];
    const who=[c.nameShort,c.age?c.age+' 歲':c.ageBand,c.sex].filter(Boolean).join('　'); const ch=chartOf(c), ruler=stayRuler(c,q), nRep=q.filter(d=>d.report).length;
    const rail=q.length>1&&q.length<=60?`<div class="rail" role="group" aria-label="本次案例">${nRep?`<span class="rl">會中報告 ${nRep} 例${q.length-nRep?`，其餘 ${q.length-nRep} 例`:''}</span>`:''}${q.map((d,i)=>`${nRep&&i===nRep?'<span class="gap"></span>':''}<button type="button" data-j="${i}" class="${d.report?'rep ':''}${i===state.presIdx?'cur':''}" title="${esc(d.code)}" aria-label="第 ${i+1} 案 ${esc(d.code)}"${i===state.presIdx?' aria-current="true"':''}></button>`).join('')}</div>`:''; const demo=!SP&&/範例/.test((state.loaded.drafts||{}).name||'');
    const fl=state.flash; state.flash=null; const lab=SP&&SP.canDecide?'定案':'討論重點';
    el.innerHTML=`<div class="pres">${ctl(state.presIdx,q.length)}${rail}${fl?`<div class="flash">${esc(fl)}</div>`:''}<div class="meta above">${demo?'<span class="muted">範例資料　</span>':''}${contLabel(c,curYmOf(q))?`<span class="cont">${contLabel(c,curYmOf(q))}</span>　`:''}${state.kind!=='all'?`<span class="muted">${state.kind==='los'?'超長住院':'M&amp;M'}　</span>`:''}${esc(c.code)}　${esc(ymLabel(c.ym))}　${typePills(c)}${c.status==='整理中'?'　<span class="muted">（整理中・預覽）</span>':''}</div><h2>${esc(who)||esc(c.code)}${ch?`<span class="chartno">病歷號 ${esc(ch)}</span>`:''}</h2><p class="dx">${esc(c.dxDetail)||'<span class="muted">（未填主診斷）</span>'}</p>${ruler}<p class="facts">${presFacts(c,!!ruler)}</p>${opinionStrip(c)}${presCard(c)}
      <button class="btn primary dopen" id="dopen">${lab}<span class="kbd">D</span></button>
      <aside class="drawer" id="drawer" hidden><div class="dhead"><b>${lab}：${esc(c.code)}</b><button class="btn sm" id="dclose">關閉（Esc）</button></div>${decideBlock(c)}</aside></div>`; }
  el.querySelectorAll('.rail button').forEach(b=>b.addEventListener('click',()=>{ state.presIdx=Number(b.dataset.j); renderPresent(); }));
  if(q.length){ bindDecide(q[state.presIdx]); $('#dopen').addEventListener('click',()=>openDrawer(true)); $('#dclose').addEventListener('click',()=>openDrawer(false)); } $('#ex').addEventListener('click',()=>setView('prep')); $('#pv').addEventListener('click',()=>{state.presIdx--;renderPresent();}); $('#nx').addEventListener('click',()=>{state.presIdx++;renderPresent();}); }
document.addEventListener('keydown',e=>{ if(state.view!=='present'||document.querySelector('.vote-ov')) return; const dr=$('#drawer'), open=dr&&!dr.hidden; if(open&&e.key==='Escape'){ openDrawer(false); return; } if(/^(INPUT|SELECT|TEXTAREA)$/.test((e.target&&e.target.tagName)||'')) return; if(open) return; if((e.key==='d'||e.key==='D')&&dr){ openDrawer(true); e.preventDefault(); return; } if(e.key==='ArrowRight'||e.key==='PageDown'){state.presIdx++;renderPresent();} if(e.key==='ArrowLeft'||e.key==='PageUp'){state.presIdx--;renderPresent();} if(e.key==='Escape') setView('prep'); });

function renderAbout(){ $('#v-about').innerHTML=`<section><div class="sec-head"><h2>每月怎麼跑</h2><span class="note">在 SharePoint 站台按書籤「M&amp;M」使用。</span></div>
  <div class="flow">
    <div><div class="ph">① 會前兩週　研究醫師</div><ol><li>按「M&amp;M」→「收案」，把討論會 Word 檔拖進去，確認後寫入。</li><li>在「案例」清單逐案補寫住院經過、初評（主要根因、促成因素、可預防性）與五個為什麼，並徵詢主治。</li><li>完成後把狀態改成「待討論」。</li><li>在「開會」頁的「報告」欄，勾選要在會中報告的案例。</li></ol></div>
    <div><div class="ph">② 會前　主任</div><ol><li>按「M&amp;M」→「開會」。</li><li>在「待討論案例」確認本月案例，依主治意見分成三組。</li></ol></div>
    <div><div class="ph">③ 會議中　筆電接投影</div><ol><li>按「投影模式」，用 ← → 換案；上方「全螢幕」供投影使用。</li><li>在右側選定共識主要根因、可預防性與決策方式，按「定案」。正式紀錄與案例狀態會自動更新。</li><li>意見分歧時先投票，再把票數填入後定案。</li></ol></div>
    <div><div class="ph">④ 會後</div><ol><li>正式紀錄已在會中完成，無需另行整理。</li><li>需要時新增「改善行動」（負責人、到期日）。</li><li>在「紀錄與分析」查看趨勢；按「重新讀取」取得最新內容。</li></ol></div>
  </div>
  <h3 style="margin-top:26px">資料與隱私</h3>
  <p class="small">${SP?'畫面上的資料直接讀自科內 SharePoint 清單，關閉後不會留在這台電腦。「案例」只含姓＋OO 與年齡；病歷號、全名等可識別資料另存在權限限定的「對照表」。':'匯入的資料只存在這台電腦的瀏覽器裡，可在「載入」頁按「清除已載入資料」移除。仍屬科內資料，請勿在公用電腦使用。'}</p>
  <h3 style="margin-top:18px">說明文件</h3>
  <p class="small"><a href="https://jnynlin.github.io/hemonc-mm/handbook.html" target="_blank" rel="noopener">研究醫師手冊</a>　·　<a href="https://jnynlin.github.io/hemonc-mm/bookmarks.html" target="_blank" rel="noopener">使用說明</a></p></section>`; }

if(SP){ spApply(SP.data); const lb=document.querySelector('#nav button[data-view="load"]'); if(lb) lb.remove(); const ab=document.querySelector('#nav button[data-view="about"]'); if(ab){ const a=document.createElement('a'); a.textContent='說明'; a.href='https://jnynlin.github.io/hemonc-mm/bookmarks.html'; a.target='_blank'; a.rel='noopener'; a.className='navlink'; ab.replaceWith(a); } const h=document.querySelector('.top-in > div'); if(h) h.remove(); setView('prep'); }
else { restore(); (function(){ const h=location.hash.slice(1); setView(VIEWS.includes(h)&&h!=='present'?h:(state.records.length?'records':'load')); })(); }
</script>
